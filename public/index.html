<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afterglow Shelter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div>
        <p class="eyebrow">MULTIPLAYER SURVIVAL</p>
        <h1>AFTERGLOW SHELTER</h1>
      </div>
      <div class="status">
        <span id="connectionDot"></span>
        <span id="connectionText">연결 중</span>
      </div>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="panel">
        <h2>대피조 만들기</h2>
        <input id="nickname" maxlength="14" placeholder="닉네임">
        <div class="row">
          <button id="openCreateButton" class="primary">새 방</button>
          <button id="quickJoinButton">빠른 참가</button>
        </div>
        <div class="row">
          <input id="roomCodeInput" maxlength="6" placeholder="방 코드">
          <button id="joinCodeButton">코드 참가</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>공개방</h2>
          <button id="refreshButton">↻</button>
        </div>
        <div id="roomList"></div>
      </div>
    </section>

    <section id="lobbyScreen" class="screen">
      <div class="panel">
        <div class="panel-head">
          <h2 id="lobbyName">대피조</h2>
          <button id="copyCodeButton">------</button>
        </div>
        <div id="playerList"></div>
        <div class="row">
          <button id="leaveButton">나가기</button>
          <button id="readyButton">준비</button>
          <button id="startButton" class="primary hidden">게임 시작</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <div id="countdownOverlay" class="overlay">
        <div id="countdown">5</div>
        <p>벙커에서 수집을 시작합니다.</p>
      </div>

      <canvas id="gameCanvas"></canvas>

      <div class="game-clock">
        <span class="clock-label">폭발까지</span>
        <strong id="timer">60</strong>
        <span>초</span>
      </div>

      <div class="game-info">
        <div id="floorName">대형 주택</div>
        <div id="bunkerMessage">벙커에서 아이템을 보관하면 손이 비워집니다.</div>
      </div>

      <div class="hands-panel">
        <div class="hands-title">손</div>
        <div id="handSlots" class="hand-slots">
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
        </div>
        <button id="depositButton" type="button">벙커에 보관</button>
        <div id="storedItems">보관함: 비어 있음</div>
      </div>

      <div id="deathOverlay" class="death-overlay hidden">
        <div class="death-card">
          <p class="death-warning">☢ 폭발 발생</p>
          <h2>죽었습니다</h2>
          <p>제한 시간 안에 벙커로 들어가지 못했습니다.</p>
          <button id="deathReturnButton" type="button">처음 화면으로</button>
        </div>
      </div>

      <div class="mobile-controls">
        <button data-dir="up">▲</button>
        <div>
          <button data-dir="left">◀</button>
          <button data-dir="down">▼</button>
          <button data-dir="right">▶</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="createDialog">
    <form id="createForm">
      <h2>새 대피조</h2>
      <input id="roomName" maxlength="24" placeholder="방 제목" required>
      <select id="maxPlayers">
        <option value="2">2명</option>
        <option value="4" selected>4명</option>
        <option value="6">6명</option>
        <option value="8">8명</option>
      </select>
      <label>
        <input id="privateRoom" type="checkbox">
        비공개
      </label>
      <p id="createError"></p>
      <div class="row">
        <button type="button" id="closeCreateButton">취소</button>
        <button class="primary" type="submit">생성</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
