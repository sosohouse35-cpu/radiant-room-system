<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afterglow Item Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div>
        <p class="eyebrow">MULTIPLAYER ITEM COLLECTION</p>
        <h1>AFTERGLOW SHELTER</h1>
      </div>
      <div class="status">
        <span id="connectionDot"></span>
        <span id="connectionText">연결 중</span>
      </div>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="panel">
        <h2>대피조 만들기</h2>
        <input id="nickname" maxlength="14" placeholder="닉네임">
        <div class="row">
          <button id="openCreateButton" class="primary">새 방</button>
          <button id="quickJoinButton">빠른 참가</button>
        </div>
        <div class="row">
          <input id="roomCodeInput" maxlength="6" placeholder="방 코드">
          <button id="joinCodeButton">코드 참가</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>공개방</h2>
          <button id="refreshButton">↻</button>
        </div>
        <div id="roomList"></div>
      </div>
    </section>

    <section id="lobbyScreen" class="screen">
      <div class="panel">
        <div class="panel-head">
          <h2 id="lobbyName">대피조</h2>
          <button id="copyCodeButton">------</button>
        </div>
        <div id="playerList"></div>
        <div class="row">
          <button id="leaveButton">나가기</button>
          <button id="readyButton">준비</button>
          <button id="startButton" class="primary hidden">게임 시작</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <div id="countdownOverlay" class="overlay">
        <div id="countdown">5</div>
        <p>아이템 수집 준비</p>
      </div>

      <canvas id="gameCanvas"></canvas>

      <div id="interactionPrompt" class="interaction-prompt hidden">
        E · 아이템 줍기
      </div>

      <div class="top-left-hud">
        <div id="floorName">1층 · 벙커</div>
        <div class="key-help">E 줍기 · F 보관 · Q 계단</div>
      </div>

      <div class="game-clock">
        <span>폭발까지</span>
        <strong id="timer">95</strong>
        <span>초</span>
      </div>

      <div class="hands-panel">
        <div class="hands-title">손 4칸</div>
        <div class="hand-slots">
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
          <div class="hand-slot">✋</div>
        </div>
        <div id="storedItems">보관함: 비어 있음</div>
      </div>

      <div id="resultOverlay" class="result-overlay hidden">
        <div class="result-card">
          <h2>수집 종료</h2>
          <p id="resultText"></p>
          <button id="returnButton">처음 화면으로</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="createDialog">
    <form id="createForm">
      <h2>새 대피조</h2>
      <input id="roomName" maxlength="24" placeholder="방 제목" required>
      <select id="maxPlayers">
        <option value="1">1명</option>
        <option value="2">2명</option>
        <option value="4" selected>4명</option>
        <option value="6">6명</option>
        <option value="8">8명</option>
      </select>
      <label>
        <input id="privateRoom" type="checkbox">
        비공개
      </label>
      <div class="row">
        <button id="closeCreateButton" type="button">취소</button>
        <button class="primary" type="submit">생성</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
