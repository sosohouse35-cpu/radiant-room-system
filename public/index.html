<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
<header><h1>AFTERGLOW SHELTER</h1><span id="status">연결 중</span></header>
<section id="home" class="screen active"><div class="panel"><input id="nick" placeholder="닉네임"><button id="new">새 방</button><input id="code" placeholder="방 코드"><button id="join">참가</button></div><div class="panel"><h2>공개방</h2><div id="rooms"></div></div></section>
<section id="lobby" class="screen"><div class="panel"><h2 id="roomName"></h2><button id="roomCode"></button><div id="players"></div><button id="ready">준비</button><button id="start">게임 시작</button></div></section>
<section id="game" class="screen game">
<canvas id="canvas"></canvas>
<div class="hud left"><b id="floor">1층</b><span>E 줍기 · F 보관 · Q 계단</span></div>
<div class="hud clock"><b id="timer">95</b>초</div>
<div id="prompt" class="prompt hidden">E · 줍기</div>
<div class="hands"><div>손 4칸</div><div id="slots" class="slots"></div><small id="stored">보관함 비어 있음</small></div>
<button id="full" class="full">⛶ 전체화면</button>
<div class="mobile">
  <div id="joystickBase" class="joystick-base">
    <div id="joystickKnob" class="joystick-knob"></div>
  </div>
  <div class="acts">
    <button id="mPick">줍기</button>
    <button id="mStore">보관</button>
    <button id="mStair">계단</button>
  </div>
</div>
</section>
<dialog id="dlg"><form id="form"><h2>새 방</h2><input id="title" required placeholder="방 제목"><select id="max"><option>1</option><option>2</option><option selected>4</option><option>6</option><option>8</option></select><button>생성</button></form></dialog>
<div id="toast"></div></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
