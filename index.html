<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Afterglow Shelter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div><p class="eyebrow">MULTIPLAYER SURVIVAL</p><h1>AFTERGLOW SHELTER</h1></div>
      <div class="status"><span id="connectionDot"></span><span id="connectionText">연결 중</span></div>
    </header>

    <section id="homeScreen" class="screen active">
      <div class="panel">
        <h2>대피조 만들기</h2>
        <input id="nickname" maxlength="14" placeholder="닉네임">
        <div class="row"><button id="openCreateButton" class="primary">새 방</button><button id="quickJoinButton">빠른 참가</button></div>
        <div class="row"><input id="roomCodeInput" maxlength="6" placeholder="방 코드"><button id="joinCodeButton">코드 참가</button></div>
      </div>
      <div class="panel"><div class="panel-head"><h2>공개방</h2><button id="refreshButton">↻</button></div><div id="roomList"></div></div>
    </section>

    <section id="lobbyScreen" class="screen">
      <div class="panel">
        <div class="panel-head"><h2 id="lobbyName"></h2><button id="copyCodeButton">------</button></div>
        <div id="playerList"></div>
        <div class="row"><button id="leaveButton">나가기</button><button id="readyButton">준비</button><button id="startButton" class="primary hidden">게임 시작</button></div>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <div id="countdownOverlay" class="overlay"><div id="countdown">5</div><p>아이템 수집 준비</p></div>
      <canvas id="gameCanvas"></canvas>
      <div class="hud">
        <div><b id="timer">60</b>초</div>
        <div id="floorName">대형 주택 1층</div>
        <div id="inventory">가방: 비어 있음</div>
      </div>
      <div class="mobile-controls">
        <button data-dir="up">▲</button>
        <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
      </div>
    </section>
  </main>

  <dialog id="createDialog">
    <form id="createForm">
      <h2>새 대피조</h2>
      <input id="roomName" maxlength="24" placeholder="방 제목" required>
      <select id="maxPlayers"><option>2</option><option selected>4</option><option>6</option><option>8</option></select>
      <label><input id="privateRoom" type="checkbox"> 비공개</label>
      <p id="createError"></p>
      <div class="row"><button type="button" id="closeCreateButton">취소</button><button class="primary">생성</button></div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
